<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
</head>
<body style="background:#000;color:#fff;text-align:center;">
    <video id="v" autoplay playsinline controls style="width:90%;border:1px solid #fff;"></video>
    <h3 id="s">Inicializace...</h3>
    <h1 id="id">---</h1>
    <button onclick="start()" style="padding:20px;background:green;color:#fff;">START PC</button>
    <br><br>
    <input type="text" id="pid" placeholder="ID z PC" style="padding:10px;">
    <button onclick="conn()" style="padding:20px;background:blue;color:#fff;">PŘIPOJIT MOBIL</button>

    <script>
        const v = document.getElementById('v');
        const s = document.getElementById('s');
        const peer = new Peer(); // Necháme PeerJS, ať si cestu najde sám bez STUNu

        peer.on('open', id => {
            document.getElementById('id').innerText = id;
            s.innerText = "PŘIPOJENO. Opiš ID.";
        });

        async function start() {
            const stream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
            v.srcObject = stream;
            v.muted = true;
            peer.on('call', call => call.answer(stream));
            s.innerText = "VYSIÍLÁŠ!";
        }

        function conn() {
            const call = peer.call(document.getElementById('pid').value, null);
            call.on('stream', st => {
                v.srcObject = st;
                v.muted = false;
                v.play();
                s.innerText = "HOTOVO!";
            });
        }
    </script>
</body>
</html>
