<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kino V4 - Krátké ID</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0f0f0f; color: white; text-align: center; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        video { width: 95%; max-width: 1100px; border-radius: 12px; background: black; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; border: 1px solid #333; }
        button { background: #007aff; color: white; border: none; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; border-radius: 8px; margin: 10px 0; width: 100%; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: white; box-sizing: border-box; text-align: center; margin-bottom: 10px; }
        #status { color: #ffcc00; font-size: 0.9em; margin-top: 15px; font-weight: bold; }
        .setup-box { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

    <video id="remoteVideo" autoplay playsinline controls muted></video>
    
    <div class="card">
        <h2 style="margin:0 0 20px 0">🎬 Zkouška prdů</h2>
        
        <div class="setup-box">
            <p style="color: #888; font-size: 0.8em; margin-bottom: 5px;">Zadej název tvého kina (např. kino123):</p>
            <input type="text" id="custom-id" placeholder="Tvoje jméno nebo kód">
            <button onclick="initPeer()" id="init-btn" style="background: #5856d6;">Aktivovat název kina</button>
        </div>

        <button onclick="startStreaming()" id="start-btn" style="background: #28a745; display:none;">1. SDÍLET OBRAZOVKU (PC)</button>
        
        <div id="join-section" style="display:none;">
            <p style="color: #888; font-size: 0.8em; margin: 20px 0 5px 0;">Partner zadá tvůj název a klikne:</p>
            <button onclick="connectToPeer()">2. PŘIPOJIT SE (iPad/Mobil)</button>
        </div>
        
        <div id="status" class="status">Status: Nejdřív aktivuj název.</div>
    </div>

    <script>
        const videoElement = document.getElementById('remoteVideo');
        const statusText = document.getElementById('status');
        let peer;

        // Funkce pro vytvoření spojení s tvým vlastním ID
        function initPeer() {
            const customId = document.getElementById('custom-id').value.trim();
            if (!customId) return alert("Zadej nějaký název!");

            // Vytvoříme Peer s tvým názvem
            peer = new Peer(customId, {
                config: {'iceServers': [
                    { url: 'stun:stun.l.google.com:19302' },
                    { url: 'stun:stun1.l.google.com:19302' }
                ]}
            });

            peer.on('open', (id) => {
                statusText.innerText = "Kino '" + id + "' je připraveno!";
                document.getElementById('init-btn').style.background = "#333";
                document.getElementById('init-btn').innerText = "Název aktivní: " + id;
                document.getElementById('start-btn').style.display = "block";
                document.getElementById('join-section').style.display = "block";
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert("Tenhle název už někdo používá, zkus jiný!");
                } else {
                    statusText.innerText = "Chyba: " + err.type;
                }
            });
        }

        // HOST (PC)
        async function startStreaming() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: 1920, height: 1080, frameRate: 60 },
                    audio: true
                });
                videoElement.srcObject = stream;
                videoElement.muted = true;
                statusText.innerText = "VYSIÍLÁŠ! Partner se může připojit.";

                peer.on('call', call => {
                    statusText.innerText = "Partner se připojil!";
                    call.answer(stream);
                });
            } catch (err) {
                statusText.innerText = "Chyba: " + err.message;
            }
        }

        // DIVÁK (iPhone/iPad)
        function connectToPeer() {
            const remoteId = document.getElementById('custom-id').value.trim();
            if(!remoteId) return alert("Zadej název kina partnera!");
            
            statusText.innerText = "Hledám kino: " + remoteId;
            const call = peer.call(remoteId, null);
            
            call.on('stream', remoteStream => {
                statusText.innerText = "STREAM PŘIJAT! Klepni na video.";
                videoElement.srcObject = remoteStream;
                videoElement.muted = false;
                videoElement.play();
            });
        }
    </script>
</body>
</html>
