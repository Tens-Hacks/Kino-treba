<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Soukromé Kino V8</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: white; text-align: center; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        video { width: 100%; height: 100vh; background: #000; object-fit: contain; }
        .ui { position: absolute; z-index: 10; background: rgba(20,20,20,0.8); padding: 20px; border-radius: 15px; width: 300px; border: 1px solid #444; }
        button { background: #007aff; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 10px; width: 100%; margin: 10px 0; }
        #status { color: #ffcc00; font-size: 0.9em; margin-bottom: 10px; }
    </style>
</head>
<body>

    <video id="remoteVideo" autoplay playsinline controls muted></video>
    
    <div class="ui" id="controlsUI">
        <div id="status">Připojování...</div>
        <button id="hostBtn" onclick="startStreaming()" style="background: #28a745;">🚀 START STREAM (PC)</button>
        <button id="unlockBtn" onclick="unlockVideo()" style="display:none; background: #ff9500;">🔊 ODBLOKOVAT VIDEO/ZVUK</button>
        <button onclick="location.reload()">🔄 REFRESH</button>
    </div>

    <script>
        const video = document.getElementById('remoteVideo');
        const status = document.getElementById('status');
        const ID_VYSILATEL = 'tens-hacker-kino';
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        if(isMobile) document.getElementById('hostBtn').style.display = 'none';

        const peer = new Peer(isMobile ? '' : ID_VYSILATEL, {
            config: {'iceServers': [{ url: 'stun:stun.l.google.com:19302' }]}
        });

        peer.on('open', () => {
            status.innerText = isMobile ? "Hledám vysílání..." : "Vysílač připraven.";
            if(isMobile) connect();
        });

        async function startStreaming() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 60 }, audio: true });
                video.srcObject = stream;
                document.getElementById('controlsUI').style.opacity = "0.2";
                status.innerText = "VYSIÍLÁŠ!";
                peer.on('call', call => call.answer(stream));
            } catch (e) { status.innerText = "Chyba: " + e.message; }
        }

        function connect() {
            const call = peer.call(ID_VYSILATEL, null);
            call.on('stream', s => {
                video.srcObject = s;
                status.innerText = "STREAM NALEZEN!";
                document.getElementById('unlockBtn').style.display = "block";
            });
            setTimeout(() => { if(!video.srcObject) connect(); }, 4000);
        }

        function unlockVideo() {
            video.muted = false;
            video.play();
            document.getElementById('controlsUI').style.display = "none";
        }
    </script>
</body>
</html>
