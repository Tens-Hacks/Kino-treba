<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Naše Soukromé Kino</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0b0b0b; color: white; text-align: center; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        video { width: 95%; max-width: 1100px; border-radius: 12px; background: black; box-shadow: 0 0 30px rgba(0,122,255,0.3); transition: 0.3s; }
        .controls { background: #1a1a1a; padding: 25px; border-radius: 18px; margin-top: 20px; width: 90%; max-width: 400px; border: 1px solid #333; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        button { background: #007aff; color: white; border: none; padding: 16px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 12px; width: 100%; margin: 10px 0; transition: 0.2s; }
        button:active { transform: scale(0.98); opacity: 0.9; }
        #status { color: #888; margin-top: 10px; font-size: 0.9em; min-height: 1.2em; }
        .live-indicator { color: #ff3b30; font-weight: bold; display: none; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="liveLabel" class="live-indicator">● LIVE (Vysíláš)</div>
    <video id="remoteVideo" autoplay playsinline controls muted></video>
    
    <div class="controls">
        <div id="hostControls">
            <button onclick="startStreaming()" style="background: #28a745;">🚀 ZAPNOUT STREAM (Pro tebe)</button>
        </div>
        <div id="status">Načítám systém...</div>
        <p style="font-size: 0.8em; color: #555; margin-top: 15px;">Přítelkyni stačí tuhle stránku jen otevřít.</p>
    </div>

    <script>
        // TVÉ FIXNÍ ID
        const MOJE_STALE_ID = 'tens-hacker'; 

        const videoElement = document.getElementById('remoteVideo');
        const statusText = document.getElementById('status');
        const liveLabel = document.getElementById('liveLabel');
        
        // Inicializace PeerJS
        const peer = new Peer(MOJE_STALE_ID, {
            config: {'iceServers': [
                { url: 'stun:stun.l.google.com:19302' },
                { url: 'stun:stun1.l.google.com:19302' }
            ]}
        });

        peer.on('open', (id) => {
            statusText.innerText = "Kino připraveno.";
            // Automatický pokus o připojení (pro diváka)
            setTimeout(autoConnect, 1500);
        });

        // 1. FUNKCE PRO TEBE (HOSTITEL NA PC)
        async function startStreaming() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { 
                        width: { ideal: 1920 }, 
                        height: { ideal: 1080 }, 
                        frameRate: { ideal: 60 } 
                    },
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });
                
                videoElement.srcObject = stream;
                videoElement.muted = true; // Aby ti to na PC nedělalo ozvěnu
                liveLabel.style.display = "block";
                statusText.innerText = "VYSIÍLÁŠ! Přítelkyně tě uvidí automaticky.";

                // Když se ona (nebo kdokoliv) připojí
                peer.on('call', call => {
                    statusText.innerText = "Partner se právě připojil!";
                    call.answer(stream);
                });

                // Detekce vypnutí streamu (tlačítko "Stop sharing" v prohlížeči)
                stream.getVideoTracks()[0].onended = () => {
                    liveLabel.style.display = "none";
                    statusText.innerText = "Stream ukončen.";
                };

            } catch (err) {
                statusText.innerText = "Chyba: " + err.message;
            }
        }

        // 2. FUNKCE PRO PŘÍTELKYNI (DIVÁK NA IPADU)
        function autoConnect() {
            // Pokud už vysílám já sám, nebudu se připojovat k sobě
            if (videoElement.srcObject) return;

            statusText.innerText = "Hledám aktivní kino...";
            
            // Zkusíme zavolat na tvoje ID
            const call = peer.call(MOJE_STALE_ID, null); 
            
            call.on('stream', remoteStream => {
                statusText.innerText = "Sleduješ stream! (Klepni pro zvuk)";
                videoElement.srcObject = remoteStream;
                videoElement.muted = false; // Zapne zvuk na iPadu
                videoElement.play().catch(() => {
                    statusText.innerText = "Klepni na video pro spuštění zvuku!";
                });
            });

            // Pokud se nikdo neozve (vysílání neběží), zkusí to znovu za 5 vteřin
            setTimeout(() => {
                if (!videoElement.srcObject) {
                    autoConnect();
                }
            }, 5000);
        }

        // Ošetření chyb (pokud je jméno obsazené)
        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                statusText.innerText = "ID 'tens-hacker' je už v provozu (vysíláš).";
            }
        });
    </script>
</body>
</html>
