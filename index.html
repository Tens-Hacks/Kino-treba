<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Moje Kino V13 - Force Connect</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: white; text-align: center; margin: 0; padding: 10px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        #video-container { width: 100%; max-width: 900px; position: relative; background: #111; border-radius: 15px; overflow: hidden; margin-bottom: 20px; aspect-ratio: 16/9; border: 2px solid #333; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .box { background: #1a1a1a; padding: 20px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid #444; }
        button { background: #007aff; color: white; border: none; padding: 16px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 12px; width: 100%; margin: 10px 0; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; text-align: center; }
        #status { color: #ffcc00; font-size: 0.85em; margin: 10px 0; min-height: 40px; }
        #my-id { color: #007aff; font-weight: bold; background: #000; padding: 8px; border-radius: 5px; display: inline-block; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="video" autoplay playsinline controls muted></video>
    </div>
    
    <div class="box">
        <div id="status">🔄 Připojování k síti...</div>
        <div style="font-size: 0.8em; color: #888;">ID PRO PARTNERA: <br><span id="my-id">...</span></div>
        
        <button onclick="startStream()" style="background: #28a745;">🚀 START VYSÍLÁNÍ (PC)</button>
        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
        <input type="text" id="peer-id" placeholder="Vlož kód z PC">
        <button onclick="joinStream()" style="background: #5856d6;">📱 PŘIPOJIT SE (iPad)</button>
    </div>

    <script>
        const status = document.getElementById('status');
        const myIdDisplay = document.getElementById('my-id');
        const video = document.getElementById('video');

        const peer = new Peer({
            config: {'iceServers': [
                { url: 'stun:stun.l.google.com:19302' },
                { url: 'stun:stun1.l.google.com:19302' },
                { 
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ]}
        });

        peer.on('open', (id) => {
            status.innerText = "✅ SÍŤ PŘIPRAVENA. \n Pokud jsi na PC, klikni na START.";
            myIdDisplay.innerText = id;
        });

        // PC ČÁST
        async function startStream() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: {ideal: 1920}, height: {ideal: 1080}, frameRate: 60 },
                    audio: true
                });
                video.srcObject = stream;
                status.innerText = "📡 VYSÍLÁŠ! \n Teď vlož kód do iPadu.";
                
                peer.on('call', call => {
                    status.innerText = "👤 PARTNER VOLÁ! Připojuji...";
                    call.answer(stream);
                    call.on('stream', () => {}); // Nutné pro některé prohlížeče
                });
            } catch (e) {
                status.innerText = "⚠️ CHYBA: " + e.message;
            }
        }

        // IPAD ČÁST
        function joinStream() {
            const id = document.getElementById('peer-id').value.trim();
            if(!id) return alert("Chybí kód!");
            
            status.innerText = "📞 Volám partnera... \n (Pokud se nic neděje, zkontroluj Hotspot)";
            
            const call = peer.call(id, null, {
                metadata: { "type": "video" }
            });
            
            call.on('stream', (remoteStream) => {
                status.innerText = "🎬 OBRAZ PŘIJAT! \n Klepni na video pro zvuk.";
                video.srcObject = remoteStream;
                video.muted = false;
                video.play();
            });

            // Časová pojistka
            setTimeout(() => {
                if(!video.srcObject) status.innerText = "❌ Spojení selhalo. \n Zkus na iPhonu vypnout Wi-Fi a jet přes data.";
            }, 15000);
        }

        peer.on('error', err => status.innerText = "❌ CHYBA: " + err.type);
    </script>
</body>
</html>
