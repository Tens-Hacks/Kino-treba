<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Kino V11 - NAT Bypass</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0b0b0b; color: white; text-align: center; margin: 0; padding: 20px; }
        video { width: 100%; max-width: 900px; background: #000; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        .box { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #444; max-width: 400px; margin: 0 auto; }
        button { background: #007aff; color: white; border: none; padding: 16px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 12px; width: 100%; margin: 10px 0; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; text-align: center; }
        #status { color: #00ff00; font-size: 0.9em; margin: 15px 0; padding: 10px; border: 1px dashed #555; }
        #my-id { background: #000; padding: 10px; border-radius: 8px; color: #007aff; font-family: monospace; font-size: 1.1em; word-break: break-all; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline controls muted></video>
    
    <div class="box">
        <div id="status">Iniciace...</div>
        <p style="font-size: 0.8em; color: #aaa;">ID TOHOTO ZAŘÍZENÍ:</p>
        <div id="my-id">Čekám...</div>
        
        <button onclick="startStream()" style="background: #28a745; margin-top: 15px;">🚀 START STREAM (PC)</button>
        <div style="margin: 20px 0; border-top: 1px solid #444;"></div>
        <input type="text" id="peer-id" placeholder="Vlož ID partnera">
        <button onclick="joinStream()">📱 PŘIPOJIT SE (Mobil)</button>
    </div>

    <script>
        const status = document.getElementById('status');
        const myIdDisplay = document.getElementById('my-id');
        const video = document.getElementById('video');

        // TURN server pomůže protlačit video přes tvůj router
        const peer = new Peer({
            config: {'iceServers': [
                { url: 'stun:stun.l.google.com:19302' },
                { url: 'stun:stun1.l.google.com:19302' },
                // Veřejný testovací TURN server (může být pomalejší, ale projde všude)
                { 
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ]}
        });

        peer.on('open', (id) => {
            status.innerText = "✅ PŘIPOJENO K SERVERU";
            myIdDisplay.innerText = id;
        });

        async function startStream() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: 1920, height: 1080, frameRate: 60 },
                    audio: true
                });
                video.srcObject = stream;
                status.innerText = "📡 VYSÍLÁŠ! Opiš ID.";
                peer.on('call', call => {
                    status.innerText = "👤 PARTNER PŘIPOJEN!";
                    call.answer(stream);
                });
            } catch (e) { status.innerText = "⚠️ CHYBA: " + e.message; }
        }

        function joinStream() {
            const id = document.getElementById('peer-id').value.trim();
            status.innerText = "📞 Pokus o spojení přes router...";
            const call = peer.call(id, null);
            call.on('stream', (s) => {
                status.innerText = "🎬 OBRAZ PŘIJAT!";
                video.srcObject = s;
                video.muted = false;
                video.play();
            });
        }
    </script>
</body>
</html>
