<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Kino V7 - Full HD</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0b0b0b; color: white; text-align: center; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        video { width: 95%; max-width: 1100px; border-radius: 12px; background: black; box-shadow: 0 0 30px rgba(0,122,255,0.3); }
        .controls { background: #1a1a1a; padding: 25px; border-radius: 18px; margin-top: 20px; width: 90%; max-width: 400px; border: 1px solid #333; }
        button { background: #007aff; color: white; border: none; padding: 16px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 12px; width: 100%; margin: 10px 0; }
        #status { color: #ffcc00; margin-top: 10px; font-size: 0.9em; font-weight: bold; padding: 10px; border: 1px dashed #444; }
    </style>
</head>
<body>

    <video id="remoteVideo" autoplay playsinline controls muted></video>
    
    <div class="controls">
        <button id="hostBtn" onclick="startStreaming()" style="background: #28a745;">🚀 ZAPNOUT STREAM (PC)</button>
        <button id="clientBtn" onclick="autoConnect()" style="background: #5856d6; display:none;">🔄 PŘIPOJIT SE ZNOVU (iPad)</button>
        <div id="status">Připojuji k serveru...</div>
    </div>

    <script>
        const videoElement = document.getElementById('remoteVideo');
        const statusText = document.getElementById('status');
        const ID_VYSILATEL = 'tens-hacker-kino'; // Změnil jsem ID pro čistý start
        
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if(isMobile) {
            document.getElementById('hostBtn').style.display = 'none';
            document.getElementById('clientBtn').style.display = 'block';
        }

        const peer = new Peer(isMobile ? '' : ID_VYSILATEL, {
            config: {
                'iceServers': [
                    { url: 'stun:stun.l.google.com:19302' },
                    { url: 'stun:stun1.l.google.com:19302' },
                    { url: 'stun:stun2.l.google.com:19302' }
                ]
            }
        });

        peer.on('open', (id) => {
            statusText.innerText = isMobile ? "Připraveno. Klikni na 'PŘIPOJIT SE'." : "Vysílač připraven.";
            if(isMobile) setTimeout(autoConnect, 1000);
        });

        // PRO PC
        async function startStreaming() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: 1920, height: 1080, frameRate: 60 },
                    audio: true
                });
                videoElement.srcObject = stream;
                statusText.innerText = "VYSIÍLÁŠ!";
                
                peer.on('call', call => {
                    statusText.innerText = "Divák připojen!";
                    call.answer(stream);
                });
            } catch (err) { statusText.innerText = "Chyba: " + err.message; }
        }

        // PRO IPAD/MOBIL
        function autoConnect() {
            statusText.innerText = "Volám vysílač...";
            const call = peer.call(ID_VYSILATEL, null);
            
            call.on('stream', remoteStream => {
                statusText.innerText = "STREAM BĚŽÍ! Klepni na video.";
                videoElement.srcObject = remoteStream;
                videoElement.muted = false;
                videoElement.play();
            });

            call.on('error', (e) => { statusText.innerText = "Chyba: " + e; });
        }

        peer.on('error', err => {
            if(err.type === 'peer-navigation-failed') statusText.innerText = "Chyba sítě. Zkus data.";
            console.error(err);
        });
    </script>
</body>
</html>
