<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Moje Kino V12 - Fixed Network</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0b0b0b; color: white; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        video { width: 100%; max-width: 900px; background: #000; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 0 30px rgba(0,122,255,0.3); border: 1px solid #333; }
        .box { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #444; max-width: 400px; width: 90%; }
        button { background: #007aff; color: white; border: none; padding: 16px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 12px; width: 100%; margin: 10px 0; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; text-align: center; margin-bottom: 10px; }
        #status { color: #00ff00; font-size: 0.9em; margin: 15px 0; padding: 10px; border: 1px dashed #555; border-radius: 8px; }
        #my-id { background: #000; padding: 10px; border-radius: 8px; color: #007aff; font-family: monospace; font-size: 1.1em; word-break: break-all; margin: 10px 0; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline controls muted></video>
    
    <div class="box">
        <div id="status">🔄 Inicializace sítě...</div>
        <div id="my-id">Čekám na přidělení linky...</div>
        
        <button onclick="startStream()" style="background: #28a745;">🚀 SPUSTIT VYSÍLÁNÍ (PC)</button>
        <div style="margin: 20px 0; border-top: 1px solid #444;"></div>
        
        <input type="text" id="peer-id" placeholder="Vlož kód z počítače">
        <button onclick="joinStream()">📱 PŘIPOJIT SE (iPad/Mobil)</button>
    </div>

    <script>
        const status = document.getElementById('status');
        const myIdDisplay = document.getElementById('my-id');
        const video = document.getElementById('video');

        // KONFIGURACE SÍTĚ (Klíč k úspěchu)
        // Používáme STUN pro přímé spojení a TURN pro obejití routeru
        const peer = new Peer({
            config: {'iceServers': [
                { url: 'stun:stun.l.google.com:19302' },
                { url: 'stun:stun1.l.google.com:19302' },
                { url: 'stun:stun2.l.google.com:19302' },
                // Veřejný TURN server pro "protlačení" dat skrz routery
                { 
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ]}
        });

        peer.on('open', (id) => {
            status.innerText = "✅ SÍŤ PŘIPRAVENA";
            myIdDisplay.innerText = id;
        });

        peer.on('error', (err) => {
            status.innerText = "❌ CHYBA: " + err.type;
            console.error(err);
        });

        // FUNKCE PRO TEBE (PC)
        async function startStream() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: 1920, height: 1080, frameRate: 60 },
                    audio: true
                });
                video.srcObject = stream;
                status.innerText = "📡 VYSÍLÁŠ! Opiš kód do iPadu.";
                
                peer.on('call', call => {
                    status.innerText = "👤 PARTNER PŘIPOJEN!";
                    call.answer(stream);
                });
            } catch (e) {
                status.innerText = "⚠️ CHYBA: " + e.message;
            }
        }

        // FUNKCE PRO PŘÍTELKYNI (iPad)
        function joinStream() {
            const id = document.getElementById('peer-id').value.trim();
            if(!id) return alert("Musíš vložit kód!");
            
            status.innerText = "📞 Navazuji spojení skrz router...";
            const call = peer.call(id, null);
            
            call.on('stream', (remoteStream) => {
                status.innerText = "🎬 OBRAZ PŘIJAT! (Klepni na video)";
                video.srcObject = remoteStream;
                video.muted = false; // Zapne zvuk
                video.play().catch(e => {
                    status.innerText = "Klepni na obraz pro zvuk!";
                });
            });

            // Pokud se spojení nepovede do 10s, zkusí to znovu
            setTimeout(() => {
                if(!video.srcObject) status.innerText = "⏳ Spojení trvá déle... vyčkej.";
            }, 10000);
        }
    </script>
</body>
</html>
